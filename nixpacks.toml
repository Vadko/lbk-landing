[phases.setup]
# nixos-26.05; this revision, not volta or NIXPACKS_NODE_VERSION, decides the deployed Node (nodejs_22 there is 22.23.4).
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g corepack@latest",
  "corepack enable",
  "corepack prepare pnpm@11.4.0 --activate",
  "pnpm install --frozen-lockfile",
]
